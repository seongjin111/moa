<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note - 메모 애플리케이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
        }

        .note-item {
            transition: background-color 0.2s;
        }

        .note-item:hover {
            background-color: #f9fafb;
        }

        .note-item.selected {
            background-color: #f3f4f6;
        }

        .action-buttons {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .note-item:hover .action-buttons {
            opacity: 1;
        }

        textarea {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        .tab-trigger {
            border-bottom: 2px solid transparent;
        }

        .tab-trigger.active {
            border-bottom-color: #9333ea;
        }

        .dropdown {
            position: relative;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            z-index: 1000;
            border-radius: 0.375rem;
            padding: 0.25rem 0;
        }

        .dropdown.active .dropdown-content {
            display: block;
        }

        .dropdown-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .dropdown-item:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- 사이드바 -->
        <div class="w-72 bg-white border-r border-gray-200 flex flex-col">
            <!-- 헤더 -->
            <div class="p-4 border-b border-gray-200">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-lg font-semibold text-purple-600">Note</h2>
                    <button onclick="addNote()" class="h-8 w-8 flex items-center justify-center rounded hover:bg-gray-100" title="새 페이지 추가">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                    </button>
                </div>
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="searchInput" placeholder="검색" class="w-full pl-9 h-9 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-600" onkeyup="searchNotes()">
                </div>
            </div>

            <!-- 노트 목록 -->
            <div id="notesList" class="flex-1 overflow-y-auto"></div>
        </div>

        <!-- 메인 영역 -->
        <div class="flex-1 flex flex-col">
            <!-- 툴바 -->

                <!-- 탭 메뉴 -->

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>

                    </button>

                        </svg>

                    </button>

            <!-- 에디터 -->
            <div id="editor" class="flex-1 bg-white overflow-y-auto">
                <div class="max-w-4xl mx-auto p-8">

                        <input type="text" id="noteTitle" placeholder="페이지 제목" class="w-full border-0 px-0 text-2xl focus:outline-none" onkeyup="updateNote()">
                        <p id="lastModified" class="text-xs text-gray-400 mt-2"></p>
                    </div>
                    <div class="mt-6">
                        <textarea id="noteContent" placeholder="내용을 입력하세요..." class="w-full min-h-[500px] border-0 outline-none resize-none" onkeyup="updateNote()"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 데이터 관리
        let notes = [];
        let selectedNoteId = null;
        let expandedNotes = new Set();

        // 초기화
        function init() {
            loadNotes();
            if (notes.length === 0) {
                notes = [{
                    id: '1',
                    title: '새로운 페이지',
                    content: '',
                    lastModified: new Date(),
                    parentId: null
                }];
                saveNotes();
            }
            selectedNoteId = notes[0].id;
            renderNotesList();
            loadNote(selectedNoteId);
        }

        // 로컬 스토리지
        function loadNotes() {
            const saved = localStorage.getItem('notes');
            if (saved) {
                notes = JSON.parse(saved).map(note => ({
                    ...note,
                    lastModified: new Date(note.lastModified)
                }));
            }
        }

        function saveNotes() {
            localStorage.setItem('notes', JSON.stringify(notes));
        }

        // 노트 추가
        function addNote() {
            const newNote = {
                id: Date.now().toString(),
                title: '새로운 페이지',
                content: '',
                lastModified: new Date(),
                parentId: null
            };
            notes.unshift(newNote);
            selectedNoteId = newNote.id;
            saveNotes();
            renderNotesList();
            loadNote(newNote.id);
        }

        // 하위 노트 추가
        function addSubNote(parentId) {
            const newNote = {
                id: Date.now().toString(),
                title: '새로운 하위 페이지',
                content: '',
                lastModified: new Date(),
                parentId: parentId
            };
            notes.push(newNote);
            selectedNoteId = newNote.id;
            expandedNotes.add(parentId);
            saveNotes();
            renderNotesList();
            loadNote(newNote.id);
        }

        // 노트 삭제
        function deleteNote(id) {
            if (confirm('이 페이지를 삭제하시겠습니까?')) {
                notes = notes.filter(note => note.id !== id);
                if (selectedNoteId === id) {
                    selectedNoteId = notes.length > 0 ? notes[0].id : null;
                }
                saveNotes();
                renderNotesList();
                if (selectedNoteId) {
                    loadNote(selectedNoteId);
                } else {
                    document.getElementById('noteTitle').value = '';
                    document.getElementById('noteContent').value = '';
                }
            }
        }

        // 노트 선택
        function selectNote(id) {
            selectedNoteId = id;
            renderNotesList();
            loadNote(id);
        }

        // 노트 업데이트
        function updateNote() {
            if (!selectedNoteId) return;
            
            const note = notes.find(n => n.id === selectedNoteId);
            if (note) {
                note.title = document.getElementById('noteTitle').value;
                note.content = document.getElementById('noteContent').value;
                note.lastModified = new Date();
                saveNotes();
                renderNotesList();
                updateLastModified(note.lastModified);
            }
        }

        // 노트 로드
        function loadNote(id) {
            const note = notes.find(n => n.id === id);
            if (note) {
                document.getElementById('noteTitle').value = note.title;
                document.getElementById('noteContent').value = note.content;
                updateLastModified(note.lastModified);
            }
        }

        // 시간 포맷
        function formatDate(date) {
            const now = new Date();
            const noteDate = new Date(date);
            const diffInMs = now - noteDate;
            const diffInMinutes = Math.floor(diffInMs / 60000);
            const diffInHours = Math.floor(diffInMs / 3600000);
            const diffInDays = Math.floor(diffInMs / 86400000);

            if (diffInMinutes < 1) return '방금 전';
            if (diffInMinutes < 60) return `${diffInMinutes}분 전`;
            if (diffInHours < 24) return `${diffInHours}시간 전`;
            if (diffInDays < 7) return `${diffInDays}일 전`;
            
            return noteDate.toLocaleDateString('ko-KR', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
        }

        function updateLastModified(date) {
            const formatted = new Date(date).toLocaleString('ko-KR', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('lastModified').textContent = formatted + ' 수정됨';
        }

        // 펼치기/접기
        function toggleExpand(noteId) {
            if (expandedNotes.has(noteId)) {
                expandedNotes.delete(noteId);
            } else {
                expandedNotes.add(noteId);
            }
            renderNotesList();
        }

        // 노트 목록 렌더링
        function renderNotesList() {
            const container = document.getElementById('notesList');
            container.innerHTML = '';
            
            const rootNotes = notes.filter(note => note.parentId === null);
            rootNotes.forEach(note => {
                renderNoteItem(note, container, 0);
            });
        }

        function renderNoteItem(note, container, level) {
            const hasChildren = notes.some(n => n.parentId === note.id);
            const isExpanded = expandedNotes.has(note.id);
            const children = notes.filter(n => n.parentId === note.id);

            const div = document.createElement('div');
            div.innerHTML = `
                <div class="note-item py-2.5 border-b border-gray-100 cursor-pointer ${selectedNoteId === note.id ? 'selected' : ''}" 
                     style="padding-left: ${16 + level * 20}px; padding-right: 16px;">
                    <div class="flex items-start gap-2">
                        <button onclick="toggleExpand('${note.id}')" class="flex-shrink-0 mt-0.5">
                            ${hasChildren ? (isExpanded ? 
                                '<svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>' :
                                '<svg class="h-4 w-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>'
                            ) : '<div class="w-4"></div>'}
                        </button>
                        <div class="flex-1 min-w-0" onclick="selectNote('${note.id}')">
                            <h3 class="text-sm mb-0.5 truncate">${note.title || '제목 없음'}</h3>
                            <p class="text-xs text-gray-500 truncate">${note.content || '내용 없음'}</p>
                            <p class="text-xs text-gray-400 mt-0.5">${formatDate(note.lastModified)}</p>
                        </div>
                        <div class="action-buttons flex items-center gap-1">
                            <button onclick="addSubNote('${note.id}')" class="h-6 w-6 flex items-center justify-center rounded hover:bg-gray-200" title="하위 페이지 추가">
                                <svg class="h-3 w-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                                </svg>
                            </button>
                            <button onclick="deleteNote('${note.id}')" class="h-6 w-6 flex items-center justify-center rounded hover:bg-gray-200" title="삭제">
                                <svg class="h-3 w-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(div);

            if (isExpanded && children.length > 0) {
                children.forEach(child => {
                    renderNoteItem(child, container, level + 1);
                });
            }
        }

        // 검색
        function searchNotes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query === '') {
                renderNotesList();
                return;
            }

            const container = document.getElementById('notesList');
            container.innerHTML = '';
            
            const filtered = notes.filter(note => 
                note.title.toLowerCase().includes(query) ||
                note.content.toLowerCase().includes(query)
            );

            filtered.forEach(note => {
                renderNoteItem(note, container, 0);
            });
        }

        // 탭 전환
        function switchTab(tabName) {
            // 모든 탭 비활성화
            document.querySelectorAll('.tab-trigger').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });

            // 선택된 탭 활성화
            event.target.closest('.tab-trigger').classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // 드롭다운
        function toggleDropdown() {
            const dropdown = document.querySelector('.dropdown');
            dropdown.classList.toggle('active');
        }

        // 외부 클릭시 드롭다운 닫기
        document.addEventListener('click', function(event) {
            const dropdown = document.querySelector('.dropdown');
            if (dropdown && !dropdown.contains(event.target)) {
                dropdown.classList.remove('active');
            }
        });

        // 초기화 실행
        init();
    </script>
</body>
</html>
