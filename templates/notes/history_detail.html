<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>히스토리 상세 - {{ note.title }}</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <style>
    .tabs { display:flex; gap:8px; margin-bottom:8px; }
    .tabs a { border:1px solid var(--border); padding:6px 10px; border-radius:6px; text-decoration:none; color:var(--text); }
    .panel { border:1px solid var(--border); padding:12px; border-radius:8px; background: var(--panel); }
    .diff del { background: rgba(244,63,94,0.25); text-decoration: none; }
    .diff ins { background: rgba(34,197,94,0.25); text-decoration: none; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <div class="appbar"><div class="title">히스토리 상세 - {{ note.title }}</div><div style="flex:1"></div><a href="/history/{{ note.note_id }}/">목록</a></div>
  <main class="editor-wrap">
    <div class="muted">저장 시각: {{ hist.timestamp }}</div>
    <form method="post" action="/history/{{ note.note_id }}/{{ hist.id|default:hist.history_id|default:'' }}/restore/" style="margin:8px 0;">
      {% csrf_token %}
      <button type="submit" class="btn">이 시점으로 복원</button>
    </form>
    <div class="tabs">
      <a href="#" onclick="show('before');return false;">Before</a>
      <a href="#" onclick="show('after');return false;">After</a>
      <a href="#" onclick="show('diff');return false;">Diff</a>
    </div>
    <div id="before" class="panel">{{ hist.before_html|safe }}</div>
    <div id="after" class="panel" style="display:none">{{ hist.after_html|safe }}</div>
    <div id="diff" class="panel diff" style="display:none">{{ hist.diff_html|safe }}</div>
  </main>
  <script>
    function show(id){
      for(const x of ['before','after','diff']){
        document.getElementById(x).style.display = (x===id)?'block':'none';
      }
    }
  </script>
</body>
</html>
