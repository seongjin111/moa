<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>편집 비밀번호 변경</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body>
  <div class="appbar"><div class="title">편집 비밀번호 변경</div></div>
  <main class="editor-wrap">
    {% if error %}<div style="color:#f87171">{{ error }}</div>{% endif %}
    {% if ok %}<div style="color:#34d399">변경되었습니다.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div style="margin:6px 0">
        <label>현재 비밀번호</label><br/>
        <input type="password" name="current_password" />
      </div>
      <div style="margin:6px 0">
        <label>새 비밀번호</label><br/>
        <input type="password" name="new_password" required />
      </div>
      <button type="submit">변경</button>
      <a href="javascript:history.back()" style="margin-left:8px">뒤로</a>
    </form>
  </main>
</body>
</html>
